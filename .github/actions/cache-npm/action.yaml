name: Cache npm packages
runs:
  using: 'composite'
  steps:
    - id: cache-npm
      uses: actions/cache@v5.0.5
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ~/.npm
        key: npm-v0-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          npm-v0-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          npm-v0-${{ runner.os }}
          npm-v0

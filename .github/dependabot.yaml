# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json

version: 2
updates:
  # group updates for minor and patch version
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels:
      - "maintenance"
      - "dependencies"
    ignore:
      - dependency-name: "*"
        # Ignore major updates for all dependencies
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [patch, minor]
    open-pull-requests-limit: 1

  - package-ecosystem: gradle
    directory: "/backend"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels:
      - "maintenance"
      - "dependencies"
    ignore:
      - dependency-name: "*"
        # Ignore major updates for all dependencies
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [patch, minor]
    open-pull-requests-limit: 1

  - package-ecosystem: pub
    directory: "/frontend"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels:
      - "maintenance"
      - "dependencies"
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        # Ignore major updates for all dependencies
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [patch, minor]

  - package-ecosystem: bundler
    directory: "/frontend/ios"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels:
      - "maintenance"
      - "dependencies"
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        # Ignore major updates for all dependencies
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [patch, minor]

  - package-ecosystem: bundler
    directory: "/frontend/android"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels:
      - "maintenance"
      - "dependencies"
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        # Ignore major updates for all dependencies
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [patch, minor]

  # Ecosystems with few dependencies: minor and patch updates are grouped, major updates come as single PRs
  - package-ecosystem: gradle
    directory: "/frontend/android"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels:
      - "maintenance"
      - "dependencies"
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [patch, minor]

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels:
      - "maintenance"
      - "dependencies"
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [patch, minor]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels:
      - "maintenance"
      - "dependencies"
    open-pull-requests-limit: 1
    groups:
      all:
        patterns: ["*"]

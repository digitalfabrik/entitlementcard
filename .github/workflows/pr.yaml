name: 'PR'

on:
  pull_request:
    branches:
      - main
    paths:
      - .prettierrc
      - eslint.config-base.mjs
      - graphql.config.yml
      - package.json
      - package-lock.json
      - administration/**
      - build-configs/**

jobs:
  administration-check:
    name: 'administration check'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - uses: jdx/mise-action@v5.2.2
        with:
          version: v2026.10.21
          cache: false
          install: false
          experimental: true

      - name: Cache npm packages
        uses: ./.github/actions/cache-npm

      - name: Install node modules
        run: mise exec -- npm ci

      - name: Check Typescript
        run: mise exec -- npm run ts:check
        working-directory: administration

      - name: Run Lint
        run: mise exec -- npm run lint
        working-directory: administration

      - name: Check circular dependencies
        run: mise exec -- npm run check-circular-deps
        working-directory: administration

      - name: Run tests with coverage
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: mise exec -- npm run test:coverage -- --silent
        working-directory: administration

      - name: Report coverage
        uses: davelosert/vitest-coverage-report-action@v2.13.1
        if: always() && github.event.pull_request.user.login != 'dependabot[bot]'
        with:
          working-directory: administration

      - name: Run tests
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: mise exec -- npm run test
        working-directory: administration

  build-configs-check:
    name: 'build-configs check'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - uses: jdx/mise-action@v5.2.2
        with:
          version: v2026.5.12
          cache: false
          install: false
          experimental: true

      - name: Cache npm packages
        uses: ./.github/actions/cache-npm

      - name: Install node modules
        run: mise exec -- npm ci

      - name: Run Lint
        run: mise exec -- npm run lint
        working-directory: build-configs

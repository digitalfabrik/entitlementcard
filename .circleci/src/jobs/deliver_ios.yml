# Deliver the app to the Apple App Store or Testflight.
macos:
  xcode: 26.2.0
resource_class: m4pro.medium
parameters:
  build_config:
    type: enum
    enum: [ bayern, nuernberg, koblenz ]
  production_delivery:
    description: Whether to deliver the build to production.
    type: boolean
environment:
  FASTLANE_SKIP_UPDATE_CHECK: true
working_directory: ~/project/frontend/ios
steps:
  - prepare_workspace
  - install_mise
  - install_app_toolbelt
  - when:
      condition: << parameters.production_delivery >>
      steps:
        - run:
            name: '[FL] App Store Connect Upload'
            command: mise x -- fastlane ios appstoreconnect_upload build_config_name:<< parameters.build_config >> ipa_path:attached_workspace/<< parameters.build_config >>.ipa version_name:${NEW_VERSION_NAME}
  - unless:
      condition: << parameters.production_delivery >>
      steps:
        - run:
            name: '[FL] TestFlight Upload'
            command: mise x -- fastlane ios upload_to_test_flight build_config_name:<< parameters.build_config >> ipa_path:attached_workspace/<< parameters.build_config >>.ipa
  - notify

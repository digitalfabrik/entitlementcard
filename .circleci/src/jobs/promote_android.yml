# Promote the app from the beta to the production track in the Google Play Store.
parameters:
  build_config:
    type: enum
    enum: [ bayern, nuernberg, koblenz ]
    default: bayern
docker:
  - image: cimg/base:2026.04
resource_class: small
environment:
  FASTLANE_SKIP_UPDATE_CHECK: true
working_directory: ~/project/frontend
steps:
  - prepare_workspace
  - install_mise
  - install_app_toolbelt
  - run:
      name: '[FL] Play Store Promotion'
      command: mise x ruby -- fastlane android playstore_promote build_config_name:<< parameters.build_config >>
      working_directory: ~/project/frontend/android
  - notify

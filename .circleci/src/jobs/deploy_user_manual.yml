# Builds the user manual from the chapters generated by e2e_administration and deploys it to GitHub Pages
# (gh-pages branch, https://digitalfabrik.github.io/entitlementcard/), see docs/user-manual.md
docker:
  - image: cimg/python:3.11
resource_class: small
steps:
  - prepare_workspace
  - run:
      name: Install python dependencies
      command: pip install --user "PyJWT[crypto]" requests mkdocs-material==9.8.1
  - run:
      name: Copy generated user manual chapters
      command: cp -r ~/attached_workspace/administration/user-manual/docs/. ~/project/administration/user-manual/docs/
  - run:
      name: Build user manual
      working_directory: ~/project/administration/user-manual
      # Fail on warnings, e.g. if a chapter in the navigation was not generated
      command: mkdocs build --strict
  - run:
      name: Deploy user manual to GitHub Pages
      working_directory: ~/project/administration/user-manual
      command: |
        TOKEN=$(~/project/.circleci/scripts/get_access_token.py)
        git config user.name "deliverino[bot]"
        git config user.email "deliverino[bot]@users.noreply.github.com"
        git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git"
        mkdocs gh-deploy --force --remote-branch gh-pages
  - notify

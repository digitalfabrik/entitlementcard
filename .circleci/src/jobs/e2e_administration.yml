docker:
  - image: cimg/openjdk:25.0-node
  - image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ehrenamtskarte
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
resource_class: medium
environment:
  _JAVA_OPTIONS: "-Xmx1g"
working_directory: ~/project
steps:
  - prepare_workspace
  - run:
      name: Setup submodules
      command: |
        git submodule sync
        git submodule update --init
  - run:
      name: Extract backend distribution
      command: tar -xf ~/attached_workspace/backend/build/distributions/backend.tar -C ~/
  - run:
      name: Migrate database
      command: ~/backend/bin/backend migrate
  - run:
      name: Start backend
      command: JWT_SECRET=HelloWorld KOBLENZ_PEPPER=123456789ABC ~/backend/bin/backend --disable-mail-service=true execute
      background: true
  - install_node_modules
  - run:
      name: Install Playwright browsers
      command: npx playwright install --with-deps chromium
      working_directory: ~/project/administration
      environment:
        DEBIAN_FRONTEND: noninteractive
        NEEDRESTART_MODE: a
  - run:
      name: Start administration frontend
      command: npm run start:ci
      background: true
      working_directory: ~/project/administration
      environment:
        BROWSER: none
  - run:
      name: Check backend health
      command: curl --retry 120 --retry-delay 1 --retry-all-errors http://localhost:8000/health
  - run:
      name: Import dev data
      command: cd ~/project/backend && ~/backend/bin/backend db-import-dev src/dev/sql
  - run:
      name: Run e2e tests
      command: npm run test:e2e
      working_directory: ~/project/administration
      environment:
        CI: "true"
  - store_artifacts:
      path: ~/project/administration/playwright-report
      destination: playwright-report
  - notify

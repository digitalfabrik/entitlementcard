# Promotes the app from Testflight to the Apple App Store.
macos:
  xcode: 26.2.0
resource_class: m4pro.medium
parameters:
  build_config:
    type: enum
    enum: [ bayern, nuernberg, koblenz ]
    default: bayern
environment:
  FASTLANE_SKIP_UPDATE_CHECK: true
working_directory: ~/project/frontend/ios
steps:
  - prepare_workspace
  - install_mise
  - install_app_toolbelt
  - run:
      name: '[FL] Appstore Connect Store Promotion'
      command: mise x ruby -- fastlane ios appstoreconnect_promote build_config_name:<< parameters.build_config >>
  - notify

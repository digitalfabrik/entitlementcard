macos:
  xcode: 26.4.0
resource_class: m4pro.medium
parameters:
  build_config:
    description: "Name of the build config to use"
    type: enum
    enum: [bayern, nuernberg, koblenz]
environment:
  FASTLANE_SKIP_UPDATE_CHECK: true
working_directory: ~/project/frontend
steps:
  - prepare_workspace
  - install_app_toolbelt
  - run:
      # The ruby orb installs RVM via `brew install gpg2`, which exits 1 on xcode 26.4 images because brew post-install
      # steps fail. Use the preinstalled rbenv instead.
      name: Install ruby 3.3
      command: |
        RUBY_VERSION=$(rbenv versions --bare | grep -E '^3\.3\.[0-9]+$' | sort -V | tail -1)
        if [ -z "${RUBY_VERSION}" ]; then
          RUBY_VERSION=$(rbenv install --list | grep -E '^3\.3\.[0-9]+$' | sort -V | tail -1)
          rbenv install "${RUBY_VERSION}"
        fi
        rbenv global "${RUBY_VERSION}"
        rbenv rehash
        ruby --version
  - run:
      # Rosetta is necessary to build flutter apps on circleci mac m1 images
      # https://github.com/digitalfabrik/entitlementcard/pull/2001#discussion_r2010122708
      name: Install rosetta
      command: softwareupdate --install-rosetta --agree-to-license
  - install_flutter:
      precache: ios
  - install_fastlane:
      directory: ios
  - install_pods
  - run:
      name: '[FL] Build'
      command: bundle exec fastlane ios build version_name:${NEW_VERSION_NAME} version_code:${NEW_VERSION_CODE} build_config_name:<< parameters.build_config >>
      working_directory: ios
  - store_artifacts:
      path: ~/<< parameters.build_config >>.ipa
  - persist_to_workspace:
      root: ~/
      paths:
        - << parameters.build_config >>.ipa
  - notify

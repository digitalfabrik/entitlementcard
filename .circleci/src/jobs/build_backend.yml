docker:
  - image: cimg/base:2026.04
resource_class: small
parameters:
  release:
    description: Whether this is a release build. If true, the source context is uploaded to Sentry.
    type: boolean
    default: false
environment:
  # The small resource class only has 2 GB of RAM. Run the Kotlin compiler inside the Gradle process so that there is
  # only one big JVM (otherwise the Kotlin daemon inherits the Gradle jvmargs and needs another 1.5 GB), and cap its
  # heap so that heap + metaspace + native memory still fit into the container.
  # Do not use _JAVA_OPTIONS here, as it applies to every JVM (Gradle client, Gradle daemon, Kotlin daemon) at once.
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs="-Xmx1536m -XX:MaxMetaspaceSize=384m"'
  RELEASE_BUILD: << parameters.release >>
working_directory: ~/project/backend
steps:
  - prepare_workspace
  - install_mise
  - run:
      name: Setup submodules
      command: |
        git submodule sync
        git submodule update --init
  - restore_cache:
      keys:
        - v1-gradle-{{ checksum "build.gradle.kts" }}
  - run:
      name: Build backend
      # Use `assemble` instead of `build` to not run tests
      command: mise x -- ./gradlew distTar
  - save_cache:
      key: v1-gradle-{{ checksum "build.gradle.kts" }}
      paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
  - persist_to_workspace:
      root: ~/project
      paths:
        - backend/build/distributions/*
  - notify

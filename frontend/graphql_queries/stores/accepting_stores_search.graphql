query AcceptingStoresSearch($project: String!, $params: SearchParamsInput!) {
    search: searchAcceptingStoresInProjectV3(project: $project, params: $params) {
        totalCount
        stores {
            id
            name
            descriptions {
                locale
                text
            }
            contact {
                telephone
                website
                email
            }
            physicalStore {
                id
                address {
                    location
                    postalCode
                    street
                }
                coordinates {
                    lat
                    lng
                }
            }
            categoryId
        }
    }
}

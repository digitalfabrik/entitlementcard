org.gradle.jvmargs=-Xmx4096m
android.useAndroidX=true
android.enableJetifier=true
# AGP 9 defaults to its built-in Kotlin support, which conflicts with the separate
# org.jetbrains.kotlin.android plugin we still apply (built-in Kotlin needs Flutter 3.47+
# and every Flutter plugin to have migrated - see https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-app-developers).
# Keep the classic Kotlin plugin path for now; migrate this separately once those are met.
# android.builtInKotlin=false alone isn't enough - the kotlin-android plugin also casts to
# AGP's old BaseExtension, which AGP 9's new DSL (default: android.newDsl=true) no longer
# provides, so that must be disabled too.
android.builtInKotlin=false
android.newDsl=false
org.gradle.parallel=true
org.gradle.daemon=true
# android.enableR8=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

name: ehrenamtskarte
description: App for entitlementcard holders and verifiers.

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: 3.12.2
  flutter: 3.44.9

dependencies:
  flutter:
    sdk: flutter
  device_info_plus: ^13.2.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  mutex: ^3.1.0
  maplibre_gl: ^0.25.0
  provider: ^6.1.5
  graphql_flutter: ^5.3.0
  url_launcher: ^6.3.2
  flutter_svg: ^2.2.4
  permission_handler: ^11.3.0
  package_info_plus: ^10.2.1 # for about dialog
  # Cannot be updated to v7 due to https://github.com/juliansteenbakker/mobile_scanner/issues/1444
  mobile_scanner: 6.0.11
  fixnum: ^1.1.0
  # Manually update this dependency, issues can result in data loss
  # Pinned to 10.3.1 (not 11.0.0): 11.0.0 raised its Android module's compileSdk to 37, which
  # needs AGP 9 to resolve. That upgrade (+ required plugin version bumps) is tracked for a
  # separate PR. Revisit once that lands.
  flutter_secure_storage: 10.3.1
  infinite_scroll_pagination: ^4.1.0
  geolocator: ^14.0.3
  geolocator_android: ^5.0.2
  protobuf: ^3.1.0
  base32: ^2.2.0
  qr_flutter: ^4.0.0
  otp: ^3.2.0
  crypto: ^3.0.7
  shared_preferences: ^2.5.5
  tinycolor2: ^3.0.1
  sentry_flutter: ^9.27.0
  carousel_slider: ^5.1.2
  slang: ^4.19.0
  slang_flutter: ^4.14.0
  flutter_html: ^3.0.0
  timezone: ^0.10.1
  clock: ^1.1.1

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.9
  collection: ^1.18.0
  meta: ^1.8.0
  equatable: ^2.1.0
  tuple: ^2.0.1
  go_router: ^15.1.2

dev_dependencies:
  build_runner: ^2.15.1
  # Since there is no maintained protobuf build runner, we forked protofu and adapted it.
  # Here is an open pr on the original repo: https://github.com/jtmcdole/protofu/pull/9.
  # If it will be merged, we can use the original repo.
  protofu:
    git:
      url: https://github.com/digitalfabrik/protofu_builder.git
      ref: 1.2.1
  protoc_plugin: ^21.1.2
  slang_build_runner: ^4.14.0
  df_build_config:
    path: ./pubs/df_build_config
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
  test: '>=1.0.0'
  mocktail: ^1.0.4

  graphql_codegen: ^3.0.2
  gql: ^1.0.0+1

dependency_overrides:
  # path_provider_foundation 2.6.0 pulls in objective_c, which ships a native
  # assets `hook/build.dart`. build_runner AOT-compiles its build script and
  # `dart compile` refuses to run when the package graph contains a build hook,
  # breaking `build_runner build`. Pin below 2.6.0 until build_runner supports
  # build hooks (dart-lang/build#3800).
  path_provider_foundation: 2.5.1


# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/category_icons/
    - assets/detail_headers/
    - assets/ca/
    - path: assets/bayern/
      flavors:
        - bayern
    - path: assets/bayern/intro_slides/
      flavors:
        - bayern
    - path: assets/nuernberg/
      flavors:
        - nuernberg
    - path: assets/nuernberg/intro_slides/
      flavors:
        - nuernberg
    - path: assets/nuernberg/l10n/
      flavors:
        - nuernberg
    - path: assets/koblenz/
      flavors:
        - koblenz
    - path: assets/koblenz/intro_slides/
      flavors:
        - koblenz
    - path: assets/koblenz/l10n/
      flavors:
        - koblenz

  # An image asset can refer to one or more resolution-specific 'variants', see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this 'flutter' section. Each entry in this list should have a
  # 'family' key with the font family name, and a 'fonts' key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: TexGyreHeroes
      fonts:
        - asset: assets/koblenz/fonts/texgyreheros-regular.otf
        - asset: assets/koblenz/fonts/texgyreheros-italic.otf
          style: italic
        - asset: assets/koblenz/fonts/texgyreheros-bold.otf
          weight: 700
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
